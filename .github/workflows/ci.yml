name: CI

# يعمل على الـ PRs وعلى develop. أما main فالتحقق فيها جزء من خط النشر
# (cd-deploy.yml) حتى لا يتكرر نفس البناء مرتين على كل دفعة.
on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci يلتزم بـ package-lock.json حرفياً، فالبناء في CI مطابق للمحلي.
      - run: npm ci

      - run: npm run lint

      - run: npm run build
