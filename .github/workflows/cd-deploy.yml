name: CD (Production)

on:
  push:
    branches: ["main"]

# دفعتان متتاليتان لا تتسابقان على البرودكشن: الأقدم يُلغى.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  deploy:
    name: Deploy to Vercel
    # لا نشر إلا بعد نجاح التحقق. هذا هو الفرق الجوهري عن النسخة السابقة.
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global vercel@latest

      # vercel pull يجلب إعدادات المشروع ومتغيّرات البيئة عبر الـ IDs أعلاه،
      # وهو ما يغني عن حِيَل حذف مجلد .vercel يدوياً.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - run: vercel build --prod --token="$VERCEL_TOKEN"

      # --meta يربط كل نشرة بالكوميت الذي أنتجها، فيصير سؤال
      # "أي كوميت على البرودكشن الآن؟" له جواب في لوحة Vercel.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$GITHUB_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"
