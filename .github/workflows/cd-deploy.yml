name: CD (Production)

on:
  push:
    branches: ["main"]

# دفعتان متتاليتان لا تتسابقان على البرودكشن: الأقدم يُلغى.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  deploy:
    name: Deploy to Vercel
    # لا نشر إلا بعد نجاح التحقق.
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # بدون هذه الخطوة يفشل النشر بـ "exit code 1" دون ذكر السبب.
      - name: Check secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing — أضفها في Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "الأسرار الثلاثة موجودة. ORG_ID يبدأ بـ: ${VERCEL_ORG_ID:0:8}… PROJECT_ID: ${VERCEL_PROJECT_ID:0:8}…"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install --global vercel@latest

      # يفشل هنا إذا كان التوكن غير صالح أو لا يملك صلاحية على الفريق.
      - name: Vercel pull
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Vercel build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$GITHUB_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"
